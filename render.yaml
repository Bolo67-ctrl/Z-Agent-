services:
  - type: worker
    name: jarvis-whatsapp-worker
    runtime: node
    plan: starter
    region: ohio
    buildCommand: echo "No build step required for the dependency-free worker"
    startCommand: node scripts/whatsapp-agent-worker.mjs
    autoDeployTrigger: commit
    envVars:
      - key: AGENT_URL
        value: https://z-agent-zeta.vercel.app
      - key: CRON_SECRET
        sync: false
