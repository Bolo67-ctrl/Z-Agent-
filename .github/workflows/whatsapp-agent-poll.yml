name: Poll WhatsApp Agent

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: whatsapp-agent-poll
  cancel-in-progress: false

jobs:
  poll:
    # Owner-approved scheduled polling is enabled; manual dispatch remains opt-in.
    if: ${{ github.event_name == 'schedule' || vars.WHATSAPP_POLLING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Poll Jarvis agent
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AGENT_URL: ${{ vars.WHATSAPP_AGENT_URL || 'https://z-agent-zeta.vercel.app' }}
        run: |
          set -eu
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi
          if [ -z "${AGENT_URL:-}" ]; then
            echo "Missing GitHub Actions variable: WHATSAPP_AGENT_URL"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${AGENT_URL%/}/api/whatsapp-agent"
