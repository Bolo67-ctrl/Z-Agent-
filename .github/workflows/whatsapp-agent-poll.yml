name: Poll WhatsApp Agent

on:
  # Workflow changes trigger one poll after fixing the route, helping validate activation.
  push:
    branches: [main]
    paths:
      - ".github/workflows/whatsapp-agent-poll.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: whatsapp-agent-poll
  cancel-in-progress: false

jobs:
  verify-actions:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm GitHub Actions is running
        run: echo "GitHub Actions is running."

  poll:
    # Production polling is owner-approved. Manual dispatch also requires explicit opt-in.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && vars.WHATSAPP_POLLING_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Poll Jarvis agent
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Use the stable, public Production alias—not a protected deployment-specific URL.
          AGENT_URL: https://z-agent-zeta.vercel.app
        run: |
          set -eu
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${AGENT_URL%/}/api/whatsapp-agent"
