name: Poll WhatsApp Agent

on:
  schedule:
    # Run every 5 minutes, offset from the start of each hour to reduce GitHub load delays.
    - cron: "4-59/5 * * * *"
  workflow_dispatch:
  # A workflow-config change gives us one controlled way to test/resync the poller.
  # Normal application-code pushes do not trigger WhatsApp polling.
  push:
    branches:
      - main
    paths:
      - .github/workflows/whatsapp-agent-poll.yml

concurrency:
  group: whatsapp-agent-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Poll Jarvis agent
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Use the stable, public Production alias—not a protected deployment-specific URL.
          AGENT_URL: https://z-agent-zeta.vercel.app
        run: |
          set -eu
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 35 \
            --retry 2 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${AGENT_URL%/}/api/whatsapp-agent")"

          printf '%s\n' "$response" | jq .
          if ! printf '%s\n' "$response" | jq -e '.ok == true' >/dev/null; then
            echo "Jarvis poll endpoint did not report ok=true."
            exit 1
          fi
