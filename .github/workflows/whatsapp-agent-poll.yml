name: Poll WhatsApp Agent (Manual Fallback)

on:
  # Free automatic fallback. This can be delayed by GitHub and is not instant.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/whatsapp-agent-poll.yml

concurrency:
  group: whatsapp-agent-poll
  cancel-in-progress: false

jobs:
  poll:
    # Schedule/config-push runs are automatic; manual runs remain opt-in.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && vars.WHATSAPP_POLLING_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Poll Jarvis agent
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AGENT_URL: https://z-agent-zeta.vercel.app
        run: |
          set -eu
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 140 \
            --retry 1 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${AGENT_URL%/}/api/whatsapp-agent")"

          printf '%s\n' "$response" | jq .
          if ! printf '%s\n' "$response" | jq -e '.ok == true' >/dev/null; then
            echo "Jarvis poll endpoint did not report ok=true."
            exit 1
          fi
