name: Poll WhatsApp Agent (Manual Fallback)

on:
  # Cloudflare is the primary scheduled poller now. Keep this fallback manual-only.
  workflow_dispatch:

concurrency:
  group: whatsapp-agent-poll
  cancel-in-progress: false

jobs:
  poll:
    # Manual fallback stays opt-in; set WHATSAPP_POLLING_ENABLED=true to permit it.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.WHATSAPP_POLLING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Poll Jarvis agent
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AGENT_URL: https://z-agent-zeta.vercel.app
        run: |
          set -eu
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 140 \
            --retry 1 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${AGENT_URL%/}/api/whatsapp-agent")"

          printf '%s\n' "$response" | jq .
          if ! printf '%s\n' "$response" | jq -e '.ok == true' >/dev/null; then
            echo "Jarvis poll endpoint did not report ok=true."
            exit 1
          fi
